# Journal Club LoRA Fine-Tuning Configuration

# Base model (env-overridable: JOURNAL_CLUB_BASE_MODEL)
model_name: ${JOURNAL_CLUB_BASE_MODEL:-./mistral-7b}

# Student model for fine-tuning (env-overridable: JOURNAL_CLUB_STUDENT_MODEL)
# Leave empty to use base model directly. Set to a smaller model path for VRAM efficiency.
# Example: student_model_name: ./mistral-7b
student_model_name:

# Output directories
output_dir: training/journal_club_output
hf_dataset_path: training/journal_club_hf_dataset

# Sequence length
max_length: 2048  # Increased for proper training

# Training parameters
training:
  batch_size: 1
  gradient_accumulation_steps: 4
  epochs: 3  # Full training with 3 epochs
  learning_rate: 0.00002
  warmup_steps: 100
  save_steps: 500
  logging_steps: 50
  eval_strategy: "steps"
  eval_steps: 250
  save_best_model: true
  metric_for_best_model: "eval_loss"
  bf16: true
  gradient_checkpointing: true
  max_grad_norm: 1.0

# LoRA configuration
lora:
  r: 32  # Increased rank for better adaptation
  alpha: 64  # Increased scaling factor
  dropout: 0.05  # Moderate dropout for literature domain
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  task_type: "CAUSAL_LM"

# Dataset configuration
dataset:
  train_split: train
  test_split: test
