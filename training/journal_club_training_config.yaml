# Journal Club LoRA Fine-Tuning Configuration

# Base model
model_name: /home/nike/models/qwen3.5-35b-a3b-gptq

# Output directories
output_dir: training/journal_club_output
hf_dataset_path: training/journal_club_hf_dataset

# Sequence length
max_length: 4096

# Training parameters
training:
  batch_size: 1
  gradient_accumulation_steps: 8
  epochs: 4  # Increased for better convergence with small dataset
  learning_rate: 1.5e-5  # Slightly lower for stability
  warmup_steps: 100
  save_steps: 50
  logging_steps: 5
  eval_strategy: "steps"
  eval_steps: 25
  save_best_model: true
  metric_for_best_model: "eval_loss"
  bf16: true
  gradient_checkpointing: true
  max_grad_norm: 1.0

# LoRA configuration
lora:
  r: 16  # Rank of update matrices
  alpha: 32  # Scaling factor
  dropout: 0.1  # Higher dropout for literature domain
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  task_type: "CAUSAL_LM"

# Dataset configuration
dataset:
  train_split: train
  test_split: test
