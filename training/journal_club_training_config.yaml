# Journal Club LoRA Fine-Tuning Configuration

# Base model
model_name: /home/nike/models/qwen3.6-35b-a3b

# Student model for fine-tuning (smaller model to fit in VRAM)
student_model_name: /home/nike/models/qwen3-4B

# Output directories
output_dir: training/journal_club_output
hf_dataset_path: training/journal_club_hf_dataset

# Sequence length
max_length: 512  # Reduced for quick test

# Training parameters
training:
  batch_size: 1
  gradient_accumulation_steps: 4
  epochs: 1  # Quick test with 1 epoch
  learning_rate: 0.00002
  warmup_steps: 10
  save_steps: 20
  logging_steps: 2
  eval_strategy: "steps"
  eval_steps: 10
  save_best_model: true
  metric_for_best_model: "eval_loss"
  bf16: true
  gradient_checkpointing: true
  max_grad_norm: 1.0

# LoRA configuration
lora:
  r: 16  # Rank of update matrices
  alpha: 32  # Scaling factor
  dropout: 0.1  # Higher dropout for literature domain
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"
  task_type: "CAUSAL_LM"

# Dataset configuration
dataset:
  train_split: train
  test_split: test
